<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de médias</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Calculadora de médias</h1>
        <form id="formulario">
            <input type="text" id="nome" placeholder="Título do trabalho">
            <input type="number" id="nota" placeholder="Nota">
            <button type="submit">Adicionar +</button>
        </form>
    </div>
    <div class="container2">
        <table id="tabela" cellspacing="0">
            <thead>
                <tr>
                    <th>Título do trabalho</th>
                    <th>Nota</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td>Média final</td>
                    <td id="media-final">---</td>
                    <td id="media-final-resultado">---</td>
                </tr>
            </tfoot>
        </table>
    </div>
    <script src="script.js"></script>
</body>

</html>
